name: images

# Build + push the keasy instance images (server, web) to GHCR on release tags.
# Tag-triggered so images map 1:1 to a release. The deployed ref lives in git as
# the fleet version-of-record (infra/k8s/platform/tenants-appset.yaml image.tag);
# Argo CD pulls it — nothing pushes images onto a host.
#
# Prereqs (operator):
#   - the server image's `FROM ghcr.io/kanzo-tech/fossil` base is PRIVATE → grant the
#     keasy repo read access to the fossil-lang package (or swap the login to a PAT).
#   - `FOSSIL_LANG_TOKEN` secret (contents: read on fossil-lang) for the sibling
#     checkout the `fossil-run-status` [patch] needs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: keasy
      # Sibling rmlext for the fossil-run-status [patch]. The repo is public, so
      # the default GITHUB_TOKEN reads it — no PAT needed.
      - uses: actions/checkout@v4
        with:
          repository: Kanzo-Tech/fossil-lang
          path: rmlext

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kanzo-tech/keasy-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: keasy/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/kanzo-tech/keasy-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Keyless cosign signature (GitHub OIDC → Fulcio/Rekor) — this is what the
      # in-cluster Kyverno verify-keasy-images policy checks before admitting a pod.
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/kanzo-tech/keasy-server@${{ steps.build.outputs.digest }}

      # SBOM, attested to the image digest (supply-chain visibility).
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/kanzo-tech/keasy-server@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/attest-sbom@v2
        with:
          subject-name: ghcr.io/kanzo-tech/keasy-server
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kanzo-tech/keasy-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/kanzo-tech/keasy-web
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Keyless cosign signature — verified in-cluster by verify-keasy-images.
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/kanzo-tech/keasy-web@${{ steps.build.outputs.digest }}

      # SBOM, attested to the image digest.
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/kanzo-tech/keasy-web@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/attest-sbom@v2
        with:
          subject-name: ghcr.io/kanzo-tech/keasy-web
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # ── Close the release loop ──────────────────────────────────────────────────
  # Write the just-built digests back to the fleet version-of-record
  # (tenants-appset.yaml image.server/web) as a PR. Merging the PR is the deploy
  # gate — Argo CD syncs `main`. Pinning by digest (not the mutable tag) makes the
  # deployed ref reproducible and sets up cosign/Kyverno verification later.
  # Note: the PR is opened with GITHUB_TOKEN, so it won't itself trigger other
  # workflows; a manifest-validation gate (when added) needs a PAT/App here.
  release:
    needs: [server, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin the fleet images by digest
        env:
          VERSION: ${{ github.ref_name }}
          SERVER_REF: ghcr.io/kanzo-tech/keasy-server@${{ needs.server.outputs.digest }}
          WEB_REF: ghcr.io/kanzo-tech/keasy-web@${{ needs.web.outputs.digest }}
        run: |
          yq -i '
            .spec.template.spec.source.helm.valuesObject.image = {"server": strenv(SERVER_REF), "web": strenv(WEB_REF)}
            | .spec.template.spec.source.helm.valuesObject.image.server line_comment = strenv(VERSION)
            | .spec.template.spec.source.helm.valuesObject.image.web    line_comment = strenv(VERSION)
          ' infra/k8s/platform/tenants-appset.yaml

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "release: pin fleet to ${{ github.ref_name }} by digest"
          branch: release/${{ github.ref_name }}
          title: "release: ${{ github.ref_name }}"
          body: |
            Bump the fleet **version-of-record** to `${{ github.ref_name }}`, pinned by digest.

            - `keasy-server` → `${{ needs.server.outputs.digest }}`
            - `keasy-web` → `${{ needs.web.outputs.digest }}`

            Merging this deploys the release — Argo CD syncs `main`.
          labels: release
