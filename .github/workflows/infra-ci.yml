name: infra-ci

on:
  pull_request:
    paths: ["infra/terraform/**", "infra/auth/**", "infra/ai/**", ".github/workflows/infra-ci.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**", "infra/auth/**", "infra/ai/**", ".github/workflows/infra-ci.yml"]

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # auth, ai and platform use kanzo-ui's modules by git: init fetches them.
        module: [terraform/platform, terraform/instances, auth, ai]
    defaults:
      run:
        working-directory: infra/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      # The version the dev stack's provision service runs.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14"
          terraform_wrapper: false

      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
