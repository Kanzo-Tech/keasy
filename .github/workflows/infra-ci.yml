name: infra-ci

# The compose files are the whole system: they must resolve — the platform included from kanzo-ui
# at KANZO_UI_REF, every secret named — before anything runs them.
on:
  pull_request:
    paths: ["compose*.yaml", "infra/**", ".github/workflows/infra-ci.yml"]
  push:
    branches: [main]
    paths: ["compose*.yaml", "infra/**", ".github/workflows/infra-ci.yml"]

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Development resolves
        run: docker compose --profile faults config --quiet

      - name: The scripts
        run: shellcheck infra/dev/seed.sh
