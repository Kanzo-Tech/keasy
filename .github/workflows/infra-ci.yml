name: infra-ci

# The compose files are the whole system, in development and in a deployment: both must resolve —
# the platform included from kanzo-ui at KANZO_UI_REF, every organization's file, every secret
# named — before anything runs them.
on:
  pull_request:
    paths: ["compose*.yaml", "infra/**", ".github/workflows/infra-ci.yml"]
  push:
    branches: [main]
    paths: ["compose*.yaml", "infra/**", ".github/workflows/infra-ci.yml"]

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Development resolves
        run: docker compose --profile local-models --profile faults config --quiet

      # The secrets' values are stand-ins: what is checked is that every one a file names is
      # supplied — each organization's sealing key among them.
      - name: A deployment resolves
        run: |
          orgs=(infra/prod/orgs/*.yaml)
          {
            for name in KC_ADMIN_PASSWORD KC_DB_PASSWORD AI_DB_PASSWORD KEASY_OIDC_CLIENT_SECRET KEASY_SESSION_SECRET; do
              echo "$name=stand-in"
            done
            for org in "${orgs[@]}"; do
              alias=$(basename "$org" .yaml)
              echo "KEASY_SECRET_KEY_$(tr 'a-z-' 'A-Z_' <<<"$alias")=stand-in"
            done
          } > "$RUNNER_TEMP/secrets.env"
          docker compose -f compose.yaml -f compose.prod.yaml $(printf -- '-f %s ' "${orgs[@]}") \
            --env-file infra/prod/prod.env --env-file "$RUNNER_TEMP/secrets.env" config --quiet

      - name: The scripts
        run: shellcheck infra/prod/secrets.sh infra/prod/sops infra/dev/seed.sh infra/dev/realm-migrate.test.sh

      # A development stack from before compose.yaml declared keasy moves onto it by itself, whatever
      # states it holds.
      - name: realm-migrate, on every state a stack can hold
        run: infra/dev/realm-migrate.test.sh
