name: manifests-ci

# Validate the GitOps manifests + realm Terraform before they reach `main`. Argo CD
# auto-syncs main → prod (automated + selfHeal), so main IS production intent: a broken
# chart or manifest merged here self-applies. This is the gate that was missing.

on:
  pull_request:
    paths:
      - "infra/k8s/**"
      - "infra/terraform/**"
      - ".github/workflows/manifests-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/k8s/**"
      - "infra/terraform/**"

concurrency:
  group: manifests-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.8.0

jobs:
  helm:
    name: helm chart (lint + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      # Lint with representative values (the chart requires slug/displayName/etc., so
      # linting with empty defaults would flag an invalid `keasy-ws-` name).
      - name: Lint the tenant chart
        run: |
          helm lint infra/k8s/tenant-chart \
            --set slug=acme --set displayName=Acme \
            --set baseDomain=keasy.example.com --set kcHostname=auth.keasy.example.com

      # Render with representative values and validate every rendered object against the
      # Kubernetes JSON schemas (strict = no unknown fields). The chart is all core
      # resources, so nothing is skipped here.
      - name: Render + validate the tenant chart
        run: |
          helm template t infra/k8s/tenant-chart \
            --set slug=acme --set displayName=Acme \
            --set baseDomain=keasy.example.com --set kcHostname=auth.keasy.example.com \
            | kubeconform -strict -summary

  platform:
    name: platform manifests (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      # Argo Applications, the CNPG Cluster, cert-manager ClusterIssuer etc. are CRDs
      # with no upstream JSON schema — skip those, but strictly validate core resources
      # (namespaces, and any plain manifests) and catch malformed YAML.
      - name: Validate platform + bootstrap manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            infra/k8s/platform/ infra/k8s/bootstrap/root-app.yaml

  terraform:
    name: realm terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: fmt
        run: terraform -chdir=infra/terraform/realm fmt -check -recursive

      - name: init + validate
        run: |
          terraform -chdir=infra/terraform/realm init -backend=false -input=false
          terraform -chdir=infra/terraform/realm validate
