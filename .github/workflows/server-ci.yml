name: server-ci

on:
  # `images` gates publishing on it.
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: server (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs what server/rust-toolchain.toml pins.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: server

      - name: fmt
        working-directory: server
        run: cargo fmt --check

      - name: clippy
        working-directory: server
        run: cargo clippy --workspace --all-targets -- -D warnings

      # src/problems.rs is generated from problems.bnf and @kanzo-tech/kernel's,
      # which npm ships: the kernel's is read from api/node_modules.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: problems match the registries
        run: |
          pnpm install --frozen-lockfile --filter @keasy/api
          cd server && cargo xtask problems --check

      # Includes the golden test that the committed api/openapi.json is the
      # contract the routes publish.
      - name: test
        working-directory: server
        run: cargo test
