name: server-ci

on:
  # `images` gates publishing on it.
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: server (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          components: rustfmt, clippy

      - name: fmt
        working-directory: server
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: server
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        working-directory: server
        run: cargo test --workspace

      # The contract the routes publish must be the one committed in `api/`.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @keasy/api
      - name: contract drift
        run: make api && git diff --exit-code api/
