name: server-ci

on:
  # `images` gates publishing on it.
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: server (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs what server/rust-toolchain.toml pins.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: server

      - name: fmt
        working-directory: server
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: server
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        working-directory: server
        run: cargo test
