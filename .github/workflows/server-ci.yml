name: server-ci

# Rust CI for the keasy-server crate. Its only fossil dependency,
# `fossil-run-status`, is a git-dep on a public rmlext release tag — cargo fetches
# it. No sibling checkout, no token.

on:
  # Callable so `images` can gate a release on it: a tag used to publish without
  # running a single test.
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: server (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          components: rustfmt, clippy

      - name: fmt
        working-directory: server
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: server
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        working-directory: server
        run: cargo test
