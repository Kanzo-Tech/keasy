# One organization's server, which every organization's file extends (infra/prod/orgs/<alias>.yaml;
# compose.override.yaml in development). The server is per organization, and so is its data: it
# validates the bearer token the web forwards against the realm's keys, checks `aud` against
# keasy-api, and reads the roles for its organization alone. It holds no client secret and no
# session; it holds its credential-sealing key, which exists nowhere else.
services:
  server:
    image: ghcr.io/kanzo-tech/keasy-server:${KEASY_VERSION:-dev}
    environment:
      KEASY_DATA_DIR: /var/lib/keasy
      KEASY_OIDC_ISSUER_URL: ${KC_HOSTNAME:-http://localhost:8080}/realms/${KC_REALM:-kanzo}
      KEASY_OIDC_INTERNAL_BASE_URL: http://keycloak:8080
      KEASY_OIDC_CLIENT_ID: keasy
      KEASY_SECRET_KEY_FILE: /run/secrets/secret-key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The server owns an SQLite file, which takes one writer: an update stops the old server
    # before the new one starts.
    restart: unless-stopped
