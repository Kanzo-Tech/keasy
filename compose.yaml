# keasy, as it runs anywhere: the one web that serves every organization, the platform's edge in
# front of it, and keasy's registration with the platform realm. The platform itself — identity and
# the edge — is kanzo-ui's, included by the environment's overlay at the release keasy is built against:
#
#   docker compose up                                  development: compose.override.yaml, read on its own
#
# Each organization runs its own server (compose.server.yaml), one compose file per organization.
# The variables below are the same in every environment; development's values are the defaults,
# a deployment, when there is one, sets its own.

name: keasy

services:
  # The edge every browser reaches (kanzo-ui's `auth-proxy`, oauth2-proxy): it signs the person in as
  # keasy's client, keeps the session, and forwards the access token to the web. The redirect is
  # derived from the host, so one proxy serves every organization at <alias>.<KEASY_DOMAIN>; the
  # token names keasy-api in `aud` and every organization the person belongs to.
  auth-proxy:
    environment:
      OAUTH2_PROXY_CLIENT_ID: keasy
      OAUTH2_PROXY_SCOPE: openid email profile organization:* keasy-api
      OAUTH2_PROXY_UPSTREAMS: http://web:3000
      OAUTH2_PROXY_PROXY_PREFIX: /api/auth
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${KEASY_WHITELIST_DOMAINS:-.localhost:3000}
      # A call to the API whose session ended answers 401, which the page turns into a sign-in.
      OAUTH2_PROXY_API_ROUTES: ^/api/v1/
    secrets:
      - source: keasy-oidc
        target: auth-proxy-client
      - source: keasy-cookie
        target: auth-proxy-cookie
    ports:
      - "3000:4180"
    depends_on:
      web:
        condition: service_healthy

  # The web for every organization: it reads the organization from the host, the person from the
  # token the edge forwards, and forwards /api/v1 to that organization's server with the same token.
  # It holds no secret and no session.
  web:
    image: ghcr.io/kanzo-tech/keasy-web:${KEASY_VERSION:-dev}
    environment:
      KEASY_BASE_DOMAIN: ${KEASY_DOMAIN:-localhost}
      KEASY_OIDC_ISSUER_URL: ${KC_HOSTNAME:-http://localhost:8080}/realms/${KC_REALM:-kanzo}
      KEASY_OIDC_JWKS_URL: http://keycloak:8080/realms/${KC_REALM:-kanzo}/protocol/openid-connect/certs
      KEASY_OIDC_CLIENT_ID: keasy
      # The server of the organization a request addresses: each answers as <alias>-server.
      KEASY_API_URL: http://{tenant}-server:8080
    # Healthy once Next answers (the forward refuses a request that says nothing of its origin): what
    # a rolling update waits for before it lets the old web go, and what the edge waits for.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/healthz/ready').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    depends_on:
      auth-realm:
        condition: service_completed_successfully
    restart: unless-stopped

  # keasy, registered with the platform realm (kanzo-ui services/auth/realm/declarations.tf): its
  # client and roles, and the environment's organizations.
  auth-realm:
    configs:
      - source: keasy-application
        target: /declarations/keasy/application.yaml
    secrets: [keasy-oidc]
    volumes:
      - ${KEASY_ORGANIZATIONS:-./infra/dev/orgs}:/declarations/keasy/organizations:ro

configs:
  keasy-application:
    content: |
      x-application:
        client_id: keasy
        description: keasy — one web for every organization, behind the platform's edge. The browser never holds a token.
        # The API every organization's server validates `aud` against.
        api: keasy-api
        # One web for every organization, at <alias>.<domain>.
        origin: ${KEASY_ORIGIN:-http://{organization}.localhost:3000}
        # The edge's callback (auth-proxy's OAUTH2_PROXY_PROXY_PREFIX, then /callback).
        callback: /api/auth/callback
        client_secret_file: /run/secrets/keasy-oidc
        # The hierarchy, declared once. Tokens carry it expanded, and the server and the web ask
        # only whether a role is present (server/src/authentication/role.rs).
        roles:
          reader: { description: "Reads everything in the workspace: graphs, outputs, connections." }
          editor: { description: "Builds graphs, connections and secrets; changes what they own.", composites: [reader] }
          admin: { description: "Configures the workspace and changes anything in it.", composites: [editor] }
