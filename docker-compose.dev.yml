# Development overlay — hot reload, demo data, relaxed healthchecks.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  server:
    # Context is `server/`: nothing outside it is needed — fossil-run-status is a
    # git dep and no fossil binary ships (keasy is a pure host).
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - ./server/src:/src/server/src
      - server-target:/src/server/target
      # Cargo registry persists across container recreation so the runtime
      # compile (deps are no longer pre-built in the image — see Dockerfile.dev)
      # doesn't re-download crates on every `make dev` rebuild.
      - cargo-registry:/usr/local/cargo/registry
    environment:
      # The workspace's Keycloak Organization (membership container). Its alias
      # matches the org declared in the realm import; the server resolves the
      # org id from it at boot.
      KEASY_ORG_ALIAS: ${KEASY_ORG_ALIAS:-keasy}
      KEASY_WORKSPACE_NAME: ${KEASY_WORKSPACE_NAME:-Keasy}
      KEASY_BASE_DOMAIN: ${KEASY_BASE_DOMAIN:-keasy.local}
      RUST_LOG: debug
      # The dev bucket, declared so nobody has to type credentials to see data.
      # The AWS_* names are the ones the S3 provider schema already declares for
      # its fields; the server reads them once, at boot, to create the account.
      KEASY_BOOTSTRAP_CONNECTION_NAME: ${MINIO_CONNECTION_NAME:-MinIO dev bucket}
      KEASY_BOOTSTRAP_CONNECTION_URL: s3://${MINIO_BUCKET:-keasy-dev}/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      # Reachable under this name from the server AND from the browser — see the
      # minio service below.
      AWS_ENDPOINT_URL: http://minio.localhost:9000
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      interval: 10s
      retries: 30
      # Deps compile at runtime now (not baked into the image), so the FIRST
      # `up` (empty volumes / post-`make clean`) does a full cold compile of
      # ~400 crates. Generous window so caddy's depends_on doesn't flap; warm
      # rebuilds are seconds.
      start_period: 900s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      # The dev image is deps-only (source is bind-mounted for hot reload). `scripts/`
      # is part of that source — `predev` runs `scripts/copy-fossil-wasm.mjs` — so it
      # must be mounted like src/public, else the container exits 1 (→ Caddy 502).
      - ./web/scripts:/app/scripts
    healthcheck:
      # `/` is a redirect to `/v1/auth/oidc-start`, a route only Caddy can reach — busybox
      # wget follows it into Next, gets a 404 and calls the container unhealthy forever.
      # Ask Node instead, and don't follow: any answer below 500 means Next is serving.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Dev object store (MinIO) ────────────────────────────────────────────────
  # The S3 substrate a developer can actually read and write, dev-only: prod
  # brings its own bucket and this file is never part of that stack.
  #
  # The `minio.localhost` alias is what makes ONE endpoint URL work on both
  # sides: inside the compose network Docker's DNS answers it, and on the host
  # `*.localhost` resolves to 127.0.0.1 — where 9000 is published. The server
  # signs a URL against that host and the browser fetches it unchanged.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      default:
        aliases:
          - minio.localhost
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # The bucket and its contents. Idempotent: `mb --ignore-existing` and a copy
  # that rewrites the same objects, so a re-`up` converges instead of failing.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set dev http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "dev/$$MINIO_BUCKET"
        mc cp /seed/people.csv /seed/orders.csv "dev/$$MINIO_BUCKET/"
        mc ls --recursive "dev/$$MINIO_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-keasy-dev}
    volumes:
      - ./infra/dev/seed:/seed:ro
    depends_on:
      minio:
        condition: service_healthy

  # SMTP sink for dev: captures Keycloak's outbound mail (Organization invitations,
  # password resets). The realm's smtpServer points at `mailpit:1025`. Read captured
  # mail — including the invitation/registration link — at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"

  caddy:
    depends_on:
      server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # web: no hard dependency — avoids startup deadlocks during HMR init

volumes:
  server-target:                   # persist Rust build artifacts across restarts
  cargo-registry:                  # persist downloaded crate sources across container recreation
  minio-data:                      # dev bucket contents survive a restart
