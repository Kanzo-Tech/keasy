# Release-image overlay: builds and runs the shipped Dockerfiles locally, with
# the base compose's dev identity (localhost issuer, dev.tfvars). Not a
# deployment — that is infra/terraform.
# Usage: make prod

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      RUST_LOG: info

  web:
    build:
      context: ./web
      dockerfile: Dockerfile

  caddy:
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
