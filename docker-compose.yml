# The dev stack. Every value is a dev literal; prod is infra/terraform.
#
# `*.localhost` is loopback on the host and a network alias here, so one URL
# works from the browser and from a container: Keycloak's issuer and MinIO's
# presigned URLs are both addressed that way.

services:
  keycloak-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Boots empty; keycloak-realm provisions it with the Terraform prod applies.
  # Its own origin, like prod's auth host.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://keycloak.localhost:8180
      KC_HTTP_PORT: "8180"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    networks:
      default:
        aliases:
          - keycloak.localhost
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s

  # The realm module prod applies, with dev.tfvars. State lives in a volume, so
  # `make clean` resets it together with Keycloak's database.
  keycloak-realm:
    image: hashicorp/terraform:1.9
    restart: "no"
    working_dir: /work
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - terraform init -input=false && terraform apply -input=false -auto-approve -state=/state/terraform.tfstate -var-file=dev.tfvars
    volumes:
      - ./infra/terraform/realm:/work
      - keycloak-realm-state:/state
    environment:
      TF_DATA_DIR: /state/.terraform
    depends_on:
      keycloak:
        condition: service_healthy

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    # Published for curl only; the app reaches the API through the web's `/api/v1`.
    ports:
      - "8080:8080"
    volumes:
      - ./server/src:/src/server/src
      - ./server/crates:/src/server/crates
      - keasy-data:/var/lib/keasy
      - ./infra/dev/bootstrap.json:/etc/keasy/bootstrap.json:ro
      - server-target:/src/server/target
      - cargo-registry:/usr/local/cargo/registry
    environment:
      RUST_LOG: debug
      KEASY_DATA_DIR: /var/lib/keasy
      # "dev-only-insecure-secret-key!!!!" in base64.
      KEASY_SECRET_KEY: ZGV2LW9ubHktaW5zZWN1cmUtc2VjcmV0LWtleSEhISE=
      KEASY_ORG_ALIAS: dev
      KEASY_WORKSPACE_NAME: Dev Workspace
      KEASY_OIDC_ISSUER_URL: http://keycloak.localhost:8180/realms/keasy
      KEASY_OIDC_CLIENT_ID: keasy-ws-dev
      # The MinIO credential, its data and shapes sources and the sink, in the
      # API's own request format.
      KEASY_BOOTSTRAP_FILE: /etc/keasy/bootstrap.json
    depends_on:
      keycloak-realm:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      # The first `up` after `make clean` compiles every dependency.
      start_period: 900s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/web/src
      - ./web/public:/app/web/public
      - ./web/scripts:/app/web/scripts
      # The contract (@keasy/api), so `make api` reaches the running web.
      - ./api/src:/app/api/src
    environment:
      KEASY_API_URL: http://server:8080
      KEASY_OIDC_ISSUER_URL: http://keycloak.localhost:8180/realms/keasy
      KEASY_OIDC_CLIENT_ID: keasy-ws-dev
      # dev.tfvars fixes it.
      KEASY_OIDC_CLIENT_SECRET: keasy-dev-secret
      KEASY_SESSION_SECRET: dev-only-insecure-session-secret-change-me
      KEASY_SESSION_STORE_URL: redis://valkey:6379
    depends_on:
      server:
        condition: service_healthy
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.1-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      default:
        aliases:
          - minio.localhost
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Idempotent, so a re-`up` converges. Every file in the seed directory lands.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set dev http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing dev/keasy-dev
        mc cp --recursive /seed/ dev/keasy-dev/
        mc ls --recursive dev/keasy-dev
    volumes:
      - ./infra/dev/seed:/seed:ro
    depends_on:
      minio:
        condition: service_healthy

volumes:
  keasy-data:
  keycloak-postgres-data:
  keycloak-realm-state:
  server-target:
  cargo-registry:
  minio-data:
