# The dev stack. Every value is a dev literal; prod is infra/terraform.
#
# Identity and the AI gateway are the platform's: kanzo-ui's services, included
# at the release in the Makefile (`make deps` checks it out into .deps/kanzo-ui).
# keasy only registers itself with them (`provision`).
#
# `*.localhost` is loopback on the host and a network alias here, so one URL
# works from the browser and from a container: the S3 endpoint a vended
# credential names is addressed that way.

include:
  - .deps/kanzo-ui/services/auth/compose.yml
  - .deps/kanzo-ui/services/ai/compose.yml

services:
  # keasy, registered with the platform: its client and roles (infra/auth), the
  # dev tenant's AI team and key (infra/ai), and its roles mapped onto the seed's
  # organization groups. State in a volume, reset by `make clean` with the rest.
  provision:
    image: hashicorp/terraform:1.14
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for root in auth ai; do
          export TF_DATA_DIR=/state/$$root/.terraform
          terraform -chdir=/infra/$$root init -input=false -backend-config=path=/state/$$root/terraform.tfstate >/dev/null
          terraform -chdir=/infra/$$root apply -input=false -auto-approve -var-file=dev.tfvars \
            $$( [ $$root = auth ] && echo "-var kc_admin_password=$$KC_ADMIN_PASSWORD" )
        done
        apk add --no-cache --quiet curl jq >/dev/null
        KC_URL=http://keycloak:8080 sh /infra/auth/dev-roles.sh
    volumes:
      - ./infra/auth:/infra/auth:ro
      - ./infra/ai:/infra/ai:ro
      - ./.deps/kanzo-ui/services/auth:/kanzo-auth:ro
      - provision-state:/state
    environment:
      # The same admin the included Keycloak boots with (kanzo-ui services/auth).
      KC_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    depends_on:
      auth-seed:
        condition: service_completed_successfully
      ai-gateway:
        condition: service_healthy

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    # Published for curl only; the app reaches the API through the web's `/api/v1`.
    ports:
      - "8081:8080"
    volumes:
      - ./server/src:/src/server/src
      - keasy-data:/var/lib/keasy
      - ./infra/dev/bootstrap.json:/etc/keasy/bootstrap.json:ro
      - server-target:/src/server/target
      - cargo-registry:/usr/local/cargo/registry
    environment:
      RUST_LOG: debug
      KEASY_DATA_DIR: /var/lib/keasy
      # "dev-only-insecure-secret-key!!!!" in base64.
      KEASY_SECRET_KEY: ZGV2LW9ubHktaW5zZWN1cmUtc2VjcmV0LWtleSEhISE=
      KEASY_ORG_ALIAS: acme
      KEASY_WORKSPACE_NAME: Acme Corporation
      KEASY_OIDC_ISSUER_URL: http://localhost:8080/realms/kanzo
      KEASY_OIDC_INTERNAL_BASE_URL: http://keycloak:8080
      KEASY_OIDC_CLIENT_ID: keasy
      # The dev S3 credential, its data and shapes sources and the sink, in the
      # API's own request format.
      KEASY_BOOTSTRAP_FILE: /etc/keasy/bootstrap.json
      # infra/ai/dev.tfvars fixes the dev tenant's gateway key.
      KEASY_AI_URL: http://ai-gateway:4000
      KEASY_AI_KEY: sk-keasy-dev-acme
    depends_on:
      provision:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      # The first `up` after `make clean` compiles every dependency.
      start_period: 900s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/web/src
      # The contract (@keasy/api) whole — spec, types and client — so `make api` reaches
      # the running web; its node_modules stay the image's.
      - ./api:/app/api
      - /app/api/node_modules
    environment:
      KEASY_API_URL: http://server:8080
      KEASY_OIDC_ISSUER_URL: http://localhost:8080/realms/kanzo
      KEASY_OIDC_INTERNAL_BASE_URL: http://keycloak:8080
      KEASY_OIDC_CLIENT_ID: keasy
      # infra/auth/dev.tfvars fixes it.
      KEASY_OIDC_CLIENT_SECRET: dev-only-keasy-secret
      KEASY_SESSION_SECRET: dev-only-insecure-session-secret-change-me
      KEASY_SESSION_STORE_URL: redis://valkey:6379
    depends_on:
      server:
        condition: service_healthy
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.1-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The dev S3 store: SeaweedFS, one process. Static keys in s3.json; iam.json
  # declares the role the server's vend assumes (STS AssumeRole with a session
  # policy, on this same endpoint). The bucket's CORS is cors.json, put by
  # s3-init: the server default exposes no Content-Range, and the browser's
  # ranged reads (fossil's object_store) fail without it.
  # chrislusf/seaweedfs:4.48 is sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
  s3:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -s3.port=9000
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.iam.config=/etc/seaweedfs/iam.json
      - -admin.ui=false
      - -webdav=false
    ports:
      - "9000:9000"
    networks:
      default:
        aliases:
          - s3.localhost
    volumes:
      - s3-data:/data
      - ./infra/dev/seaweedfs:/etc/seaweedfs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Idempotent, so a re-`up` converges. The shapes are in git; the graphs are
  # LDBC SNB SF0.1 and the OpenFlights subset, which `make seed` fetches into
  # infra/dev/seed/ldbc/ and geo/ — without them the bucket holds the shapes
  # alone, and this says so.
  s3-init:
    image: amazon/aws-cli:2.37.8
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: keasy-admin
      AWS_SECRET_ACCESS_KEY: keasy-admin-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:9000
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3api head-bucket --bucket keasy-dev 2>/dev/null || aws s3 mb s3://keasy-dev
        aws s3api put-bucket-cors --bucket keasy-dev --cors-configuration file:///etc/seaweedfs/cors.json
        aws s3 sync --no-progress /seed/vocab s3://keasy-dev/vocab
        # The end-to-end suite's own fixtures (e2e/fixtures/): it never reads the dev seed.
        aws s3 sync --no-progress /e2e s3://keasy-dev/e2e
        if [ -f /seed/ldbc/.sha256 ]; then
          aws s3 sync --no-progress --exclude ".gitignore" --exclude ".sha256" /seed/ldbc s3://keasy-dev/ldbc
        else
          echo "s3-init: no LDBC SNB seed — run \`make seed\`, then \`make dev\`"
        fi
        if [ -f /seed/geo/.sha256 ]; then
          aws s3 sync --no-progress --exclude ".gitignore" --exclude ".sha256" /seed/geo s3://keasy-dev/geo
        else
          echo "s3-init: no OpenFlights seed — run \`make seed\`, then \`make dev\`"
        fi
        aws s3 ls --recursive s3://keasy-dev
    volumes:
      - ./infra/dev/seed:/seed:ro
      - ./e2e/fixtures:/e2e:ro
      - ./infra/dev/seaweedfs/cors.json:/etc/seaweedfs/cors.json:ro
    depends_on:
      s3:
        condition: service_healthy

  # ── The `faults` profile: what the end-to-end suite breaks things with (e2e/) ──
  # Neither starts with `make dev`, nor with `make e2e`: the suite starts and
  # stops each around the one scenario that needs it.

  # A store that accepts every connection and never answers. Shares the S3
  # store's alias, so with `s3` stopped every vend and read the server makes to
  # `s3.localhost:9000` meets silence instead (scenario 3). Never up beside
  # `s3`: Docker's DNS would answer the alias with both.
  s3-silent:
    profiles: [faults]
    image: python:3.12-alpine
    command: ["python", "-u", "/faults/silent.py", "9000"]
    volumes:
      - ./e2e/faults:/faults:ro
    networks:
      default:
        aliases:
          - s3.localhost

  # The AI gateway, silent: accepts the relay's connection and never answers.
  # Shares the gateway's name, so with `ai-gateway` stopped the server's relay
  # meets silence instead (scenario 13). Never up beside `ai-gateway`.
  ai-gateway-silent:
    profiles: [faults]
    image: python:3.12-alpine
    command: ["python", "-u", "/faults/silent.py", "4000"]
    volumes:
      - ./e2e/faults:/faults:ro
    networks:
      default:
        aliases:
          - ai-gateway

volumes:
  keasy-data:
  provision-state:
  server-target:
  cargo-registry:
  s3-data:

