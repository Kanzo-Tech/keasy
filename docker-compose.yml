# Base compose — shared config for all environments.
# Use with an overlay: docker compose -f docker-compose.yml -f docker-compose.{dev,prod}.yml up

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  keycloak-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-changeme}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    # Boots EMPTY — the realm is provisioned declaratively by the keycloak-realm
    # (terraform) service below, the SAME config prod applies. Pinned to 26.2 (26.5.x
    # regressed on org-enabled realms); Organizations GA since 26.0.
    image: ${KEASY_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.2}
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-changeme}
      KC_HOSTNAME: http://localhost:3000/auth
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-changeme}
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # ── Realm provisioning — the SAME Terraform realm module as prod ─────────────
  # deploy_stacks=false: identity only; the app runs as the compose services below.
  # Its state lives in a volume, so `make clean` resets it with Keycloak's database
  # and it never mixes with the checkout's prod state (`make deploy-realm`).
  keycloak-realm:
    image: ${KEASY_TERRAFORM_IMAGE:-hashicorp/terraform:1.9}
    restart: "no"
    working_dir: /work
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - terraform init -input=false && terraform apply -input=false -auto-approve -state=/state/terraform.tfstate -var-file=dev.tfvars -var kc_admin_password="$$KC_ADMIN_PASSWORD"
    volumes:
      - ./infra/terraform/realm:/work
      - keycloak-realm-state:/state
    environment:
      TF_DATA_DIR: /state/.terraform
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-changeme}
    depends_on:
      keycloak:
        condition: service_healthy

  # ── Application ─────────────────────────────────────────────────────────────

  server:
    # The API is NOT published here. The browser reaches it through the web's
    # `/v1` proxy, which is the only process holding a credential; a published
    # 8080 is a way around that, so the dev overlay opens it (for curl) and the
    # prod overlay does not.
    environment:
      KEASY_BIND_ADDR: "0.0.0.0:8080"
      KEASY_DATA_DIR: /var/lib/keasy
      # DEV-ONLY placeholder. Prod injects it as a Swarm secret (*_FILE); never
      # commit a real secret here.
      KEASY_SECRET_KEY: ${KEASY_SECRET_KEY:-dev-only-insecure-secret-key-change-me}
      # Dev runs as the `dev` tenant (provisioned by the realm module / dev.tfvars).
      KEASY_ORG_ALIAS: dev
      KEASY_WORKSPACE_NAME: Dev Workspace
      # The server is a RESOURCE SERVER: it validates a bearer token and holds no
      # client secret, no session and no cookie. The relying party is the web.
      KEASY_OIDC_ISSUER_URL: http://localhost:3000/auth/realms/keasy
      KEASY_OIDC_CLIENT_ID: keasy-ws-dev
      KEASY_OIDC_AUDIENCE: keasy-api
      KEASY_OIDC_INTERNAL_BASE_URL: http://keycloak:8080
    volumes:
      - keasy-data:/var/lib/keasy
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-realm:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/live"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  web:
    environment:
      # Where the BFF forwards `/v1` once it has attached the bearer token.
      KEASY_API_URL: http://server:8080
      # The confidential client: the web is the relying party now.
      KEASY_OIDC_ISSUER_URL: http://localhost:3000/auth/realms/keasy
      KEASY_OIDC_CLIENT_ID: keasy-ws-dev
      KEASY_OIDC_CLIENT_SECRET: ${KEASY_OIDC_CLIENT_SECRET:-keasy-dev-secret}
      KEASY_OIDC_INTERNAL_BASE_URL: http://keycloak:8080
      # Seals the session cookie. DEV-ONLY placeholder; prod mounts a Swarm
      # secret at KEASY_SESSION_SECRET_FILE.
      KEASY_SESSION_SECRET: ${KEASY_SESSION_SECRET:-dev-only-insecure-session-secret-change-me}
    depends_on:
      server:
        condition: service_healthy
      keycloak-realm:
        condition: service_completed_successfully
    healthcheck:
      # `/` redirects to a route only Caddy can reach, so don't follow it: any
      # answer below 500 means Next is serving.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  keasy-data:
  keycloak-postgres-data:
  keycloak-realm-state:
