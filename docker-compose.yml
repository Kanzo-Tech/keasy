# The dev stack. Every value is a dev literal; prod is infra/terraform.
#
# `*.localhost` is loopback on the host and a network alias here, so one URL
# works from the browser and from a container: Keycloak's issuer and the S3
# endpoint a vended credential names are both addressed that way.

services:
  keycloak-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Boots empty; keycloak-realm provisions it with the Terraform prod applies.
  # Its own origin, like prod's auth host.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://keycloak.localhost:8180
      KC_HTTP_PORT: "8180"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    networks:
      default:
        aliases:
          - keycloak.localhost
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s

  # The realm module prod applies, with dev.tfvars. State lives in a volume, so
  # `make clean` resets it together with Keycloak's database.
  keycloak-realm:
    image: hashicorp/terraform:1.9
    restart: "no"
    working_dir: /work
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - terraform init -input=false && terraform apply -input=false -auto-approve -state=/state/terraform.tfstate -var-file=dev.tfvars
    volumes:
      - ./infra/terraform/realm:/work
      - keycloak-realm-state:/state
    environment:
      TF_DATA_DIR: /state/.terraform
    depends_on:
      keycloak:
        condition: service_healthy
      litellm:
        condition: service_healthy

  litellm-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The AI gateway prod runs (platform module), on the dev profile. keycloak-realm
  # mints the dev tenant's team and key here, as it does in prod. Admin console:
  # http://localhost:4000/ui (admin / the master key).
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.103.0@sha256:f4f114b1996c5923c4d62a7bbdcecb2ccf9df17bdebce76050f609be97f75f5c
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./infra/ai/litellm.dev.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: sk-dev-master-key
      DATABASE_URL: postgresql://litellm:litellm@litellm-postgres:5432/litellm
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      STORE_MODEL_IN_DB: "False"
      # Docker Desktop's VM on Apple silicon advertises SVE2 the CPU lacks, and
      # cryptography ≥ 49 dies on it with SIGILL (same fault: Parallels KB 131179).
      # This only turns off OpenSSL's ARM capability probing.
      OPENSSL_armcap: "0"
    # The dev models, served by Docker Model Runner on the host's GPU. Compose
    # pulls them on `up` and hands the gateway each one's endpoint and name.
    models:
      chat:
        endpoint_var: CHAT_URL
        model_var: CHAT_MODEL
      complete:
        endpoint_var: COMPLETE_URL
        model_var: COMPLETE_MODEL
    depends_on:
      litellm-postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    # Published for curl only; the app reaches the API through the web's `/api/v1`.
    ports:
      - "8080:8080"
    volumes:
      - ./server/src:/src/server/src
      - keasy-data:/var/lib/keasy
      - ./infra/dev/bootstrap.json:/etc/keasy/bootstrap.json:ro
      - ./infra/dev/snb.fossil:/etc/keasy/snb.fossil:ro
      - server-target:/src/server/target
      - cargo-registry:/usr/local/cargo/registry
    environment:
      RUST_LOG: debug
      KEASY_DATA_DIR: /var/lib/keasy
      # "dev-only-insecure-secret-key!!!!" in base64.
      KEASY_SECRET_KEY: ZGV2LW9ubHktaW5zZWN1cmUtc2VjcmV0LWtleSEhISE=
      KEASY_ORG_ALIAS: dev
      KEASY_WORKSPACE_NAME: Dev Workspace
      KEASY_OIDC_ISSUER_URL: http://keycloak.localhost:8180/realms/keasy
      KEASY_OIDC_CLIENT_ID: keasy-ws-dev
      # The dev S3 credential, its data and shapes sources and the sink, in the
      # API's own request format.
      KEASY_BOOTSTRAP_FILE: /etc/keasy/bootstrap.json
      # dev.tfvars fixes the dev tenant's gateway key.
      KEASY_AI_URL: http://litellm:4000
      KEASY_AI_KEY: sk-keasy-dev-workspace
    depends_on:
      keycloak-realm:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      # The first `up` after `make clean` compiles every dependency.
      start_period: 900s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/web/src
      # The contract (@keasy/api) whole — spec, types and client — so `make api` reaches
      # the running web; its node_modules stay the image's.
      - ./api:/app/api
      - /app/api/node_modules
    environment:
      KEASY_API_URL: http://server:8080
      KEASY_OIDC_ISSUER_URL: http://keycloak.localhost:8180/realms/keasy
      KEASY_OIDC_CLIENT_ID: keasy-ws-dev
      # dev.tfvars fixes it.
      KEASY_OIDC_CLIENT_SECRET: keasy-dev-secret
      KEASY_SESSION_SECRET: dev-only-insecure-session-secret-change-me
      KEASY_SESSION_STORE_URL: redis://valkey:6379
    depends_on:
      server:
        condition: service_healthy
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.1-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The dev S3 store: SeaweedFS, one process. Static keys in s3.json; iam.json
  # declares the role the server's vend assumes (STS AssumeRole with a session
  # policy, on this same endpoint). The bucket's CORS is cors.json, put by
  # s3-init: the server default exposes no Content-Range, and the browser's
  # ranged reads (fossil's object_store) fail without it.
  # chrislusf/seaweedfs:4.48 is sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
  s3:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -s3.port=9000
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.iam.config=/etc/seaweedfs/iam.json
      - -admin.ui=false
      - -webdav=false
    ports:
      - "9000:9000"
    networks:
      default:
        aliases:
          - s3.localhost
    volumes:
      - s3-data:/data
      - ./infra/dev/seaweedfs:/etc/seaweedfs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Idempotent, so a re-`up` converges. The shapes are in git; the graph is
  # LDBC SNB SF0.1, which `make seed` fetches into infra/dev/seed/ldbc/ — without
  # it the bucket holds the shapes alone, and this says so.
  s3-init:
    image: amazon/aws-cli:2.37.8
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: keasy-admin
      AWS_SECRET_ACCESS_KEY: keasy-admin-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:9000
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3api head-bucket --bucket keasy-dev 2>/dev/null || aws s3 mb s3://keasy-dev
        aws s3api put-bucket-cors --bucket keasy-dev --cors-configuration file:///etc/seaweedfs/cors.json
        aws s3 sync --no-progress /seed/vocab s3://keasy-dev/vocab
        # The end-to-end suite's own fixtures (e2e/fixtures/): it never reads the dev seed.
        aws s3 sync --no-progress /e2e s3://keasy-dev/e2e
        if [ -f /seed/ldbc/.sha256 ]; then
          aws s3 sync --no-progress --exclude ".gitignore" --exclude ".sha256" /seed/ldbc s3://keasy-dev/ldbc
        else
          echo "s3-init: no LDBC SNB seed — run \`make seed\`, then \`make dev\`"
        fi
        aws s3 ls --recursive s3://keasy-dev
    volumes:
      - ./infra/dev/seed:/seed:ro
      - ./e2e/fixtures:/e2e:ro
      - ./infra/dev/seaweedfs/cors.json:/etc/seaweedfs/cors.json:ro
    depends_on:
      s3:
        condition: service_healthy

  # ── The `faults` profile: what the end-to-end suite breaks things with (e2e/) ──
  # Neither starts with `make dev`, nor with `make e2e`: the suite starts and
  # stops each around the one scenario that needs it.

  # A store that accepts every connection and never answers. Shares the S3
  # store's alias, so with `s3` stopped every vend and read the server makes to
  # `s3.localhost:9000` meets silence instead (scenario 3). Never up beside
  # `s3`: Docker's DNS would answer the alias with both.
  s3-silent:
    profiles: [faults]
    image: python:3.12-alpine
    command: ["python", "-u", "/faults/silent.py", "9000"]
    volumes:
      - ./e2e/faults:/faults:ro
    networks:
      default:
        aliases:
          - s3.localhost

  # The AI gateway, silent: accepts the relay's connection and never answers.
  # Shares LiteLLM's name, so with `litellm` stopped the server's relay meets
  # silence instead (scenario 13). Never up beside `litellm`.
  litellm-silent:
    profiles: [faults]
    image: python:3.12-alpine
    command: ["python", "-u", "/faults/silent.py", "4000"]
    volumes:
      - ./e2e/faults:/faults:ro
    networks:
      default:
        aliases:
          - litellm

volumes:
  keasy-data:
  keycloak-postgres-data:
  keycloak-realm-state:
  server-target:
  cargo-registry:
  s3-data:
  litellm-postgres-data:

# What answers the gateway's aliases in dev: Hermes 3, quantized, on Docker
# Model Runner — native on the host, so a Mac's GPU, and nothing to install.
models:
  chat:
    model: hf.co/NousResearch/Hermes-3-Llama-3.1-8B-GGUF:Q4_K_M
  complete:
    model: hf.co/NousResearch/Hermes-3-Llama-3.2-3B-GGUF:Q4_K_M
