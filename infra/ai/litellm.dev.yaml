# The gateway's dev profile: both aliases on the host's Ollama (`make ai`), so the
# whole loop runs offline and free. The apps only ever name an alias; what answers it
# is this file's business. See infra/ai/README.md.

model_list:
  - model_name: chat
    litellm_params:
      model: ollama_chat/hermes3:8b
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: complete
    litellm_params:
      model: ollama_chat/hermes3:3b
      api_base: os.environ/OLLAMA_API_BASE

litellm_settings:
  drop_params: true
  # Off unless a request opts in: keasy's BFF opts `complete` in, where the same
  # field value asked twice is common. A cached chat turn would make Retry a no-op.
  cache: true
  cache_params:
    type: redis
    mode: default_off
    ttl: 3600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
