# Dev SSO IdP (Dex) — gives `make dev` the SAME SSO federation path as prod, offline.
# Keycloak federates to this as an upstream OIDC IdP; on login Keycloak links to the
# pre-declared user by email (dev@keasy.local). No internet, no real OAuth client.
#
# Dual-URL note (the classic dev-OIDC gotcha): the browser reaches Dex at
# localhost:5556 (issuer + authorization_url), while Keycloak reaches it server-side at
# dex:5556 (token_url/user_info_url). The realm's IdP sets these endpoints EXPLICITLY
# (infra/terraform/realm/dev.tfvars), so no discovery against the issuer is needed.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: keycloak
    name: Keycloak
    secret: keycloak-dex-secret
    redirectURIs:
      - http://localhost:3000/auth/realms/keasy/broker/dex/endpoint

enablePasswordDB: true
staticPasswords:
  # Two accounts because the product's two planes are DISJOINT: an owner administers
  # people and metadata and has no data plane, a member does the data work and cannot
  # administer. One account cannot exercise both — `workspaceRole()` answers with the
  # first role it finds, and each plane's layout sends the other role away.
  #
  # Login: dev@keasy.local / password  (member — jobs, connections, discovery)
  - email: "dev@keasy.local"
    hash: "$2a$10$ztkLjrGB4d7QA2ImOClHFOWph4LU9JDu5Ti2uCDag7cCbZtxHK1ZC"
    username: "dev"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
  # Login: owner@keasy.local / password  (owner — members, identity, catalog)
  - email: "owner@keasy.local"
    hash: "$2a$10$XYthTl0oDVCNUqiuKeP/1.aeJUN8/dhzFwfRh8tFeBk0vruo5nGgm"
    username: "owner"
    userID: "6b0c1f2e-9a4d-4c7b-8f31-2d5a7e0b93c4"
