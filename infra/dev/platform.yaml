# keasy's additions to the platform in development, applied to kanzo-ui's services where they are
# included (compose.override.yaml). Nothing here names a path: a file listed beside an included one
# resolves its paths where that one lives.
services:
  # keasy's roles on the groups the platform's development seed gives each organization — what an
  # organization admin does in the console. Merged into kanzo-ui's seed (services/auth/seed, SEED_DIR).
  auth-seed:
    configs:
      - source: keasy-roles
        target: /seed.d/keasy.json

configs:
  keasy-roles:
    content: |
      {
        "organizations": {
          "acme": {
            "groups": {
              "Admins": { "keasy": ["admin"] },
              "Data team": { "keasy": ["editor"] },
              "Analysts": { "keasy": ["reader"] }
            }
          },
          "globex": {
            "groups": {
              "Platform": { "keasy": ["admin"] },
              "Readers": { "keasy": ["reader"] }
            }
          }
        }
      }
