# Let's Encrypt issuer, DNS-01 via Cloudflare (works for both per-host and wildcard
# certs; today the tenant + Keycloak Ingresses request per-host certs). The Cloudflare
# API token Secret `cloudflare-api-token-secret` (key: api-token) is created by the
# operator in the cert-manager namespace during bootstrap — never committed.
# Wave -1: after cert-manager CRDs (wave -3) exist.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # EDIT: ops contact for ACME.
    email: ops@kanzo.tech
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
