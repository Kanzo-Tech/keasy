# Keycloak (Quarkus) via the codecentric keycloakx chart. Boots EMPTY — the realm
# Terraform (infra/terraform/realm/) configures it through the public ingress. DB is the
# CNPG keycloak-db Cluster; bootstrap admin comes from the operator-created `keycloak-admin`
# Secret (same value fed to the realm TF as kc_admin_password). Wave 0: after DB (wave -1)
# and cert-manager (wave -3). EDIT the host (auth.keasy.example.com) for your domain.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://codecentric.github.io/helm-charts
    chart: keycloakx
    targetRevision: 7.2.0
    helm:
      releaseName: keycloak
      values: |
        # The keycloak image's ENTRYPOINT is kc.sh with no default CMD → we must invoke
        # `start` (matches the Swarm args=["start"]). DB/http/hostname come from env below.
        command:
          - "/opt/keycloak/bin/kc.sh"
          - "start"
        dbchecker:
          enabled: true
        database:
          vendor: postgres
          hostname: keycloak-db-rw.keycloak.svc
          port: 5432
          database: keycloak
          username: keycloak
          existingSecret: keycloak-db-app
          existingSecretKey: password
        http:
          relativePath: /auth
        # Behind Traefik: trust X-Forwarded-* (chart default is "forwarded", which is the
        # RFC header Traefik doesn't send). Sets KC_PROXY_HEADERS=xforwarded + KC_HTTP_ENABLED.
        proxy:
          enabled: true
          mode: xforwarded
          http:
            enabled: true
        # Only what the chart doesn't already set (it provides KC_DB_*, KC_HTTP_ENABLED,
        # KC_HEALTH_ENABLED, KC_PROXY_HEADERS). extraEnv is a tpl string block.
        extraEnv: |
          - name: KC_HOSTNAME
            value: "https://auth.keasy.example.com/auth"
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            valueFrom:
              secretKeyRef:
                name: keycloak-admin
                key: username
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-admin
                key: password
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          rules:
            - host: auth.keasy.example.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - auth.keasy.example.com
              secretName: keycloak-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
