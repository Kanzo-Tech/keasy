# Kyverno — admission policy engine. It enforces verify-images-policy.yaml: a keasy-*
# image is only admitted if it carries a valid keyless cosign signature from this repo's
# `images` workflow. Kyverno self-signs its webhook certs (no cert-manager dependency)
# and its policy only matches ghcr.io/kanzo-tech/keasy-* images, so platform images
# (Keycloak, CNPG, cert-manager) are never blocked. Wave -2: operator up before the
# tenant workloads (wave 1) it guards; the ClusterPolicy (wave -1) needs its CRDs first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.1
    helm:
      releaseName: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
