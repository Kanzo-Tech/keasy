apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keasy-tenant.name" . }}-web
  labels:
    {{- include "keasy-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      com.keasy.workspace: {{ include "keasy-tenant.name" . }}
  template:
    metadata:
      labels:
        {{- include "keasy-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "keasy-tenant.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.web.port }} }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keasy-tenant.name" . }}-web
  labels:
    {{- include "keasy-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/component: web
    com.keasy.workspace: {{ include "keasy-tenant.name" . }}
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
