[package]
name = "keasy-api"
version = "0.1.0"
description = "The keasy HTTP contract: every type that crosses the wire, and nothing that touches storage"
edition = "2024"
rust-version = "1.90.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = { version = "0.10", features = ["serde"] }
strum = { version = "0.27", features = ["derive"] }
utoipa = "5"
